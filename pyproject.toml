[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fortnox-mcp"
version = "0.3.0"
description = "MCP server for day-to-day work in Fortnox: articles, prices, stock, purchasing, goods receipt, customers, offers, orders and invoices."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Elegant Lift Sweden AB" }]
keywords = ["fortnox", "mcp", "model-context-protocol", "erp", "accounting", "inventory", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "mcp>=1.23,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
fortnox-mcp = "fortnox_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fortnox_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
